  <!--
    AhmadOS favicon: a rounded window frame holding a bold "A", drawn on the 16px
    grid so it stays legible in a browser tab. Monochrome - one ink, switched to a
    light ink on dark browser chrome. A static asset cannot read the CSS design
    tokens, so its two values mirror the modern theme's background and text.
  -->
